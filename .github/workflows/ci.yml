# CloudScale Lab: Continuous Integration
#
# On every pull request and push to main:
#   1. app        : install, lint, type-check and build the Next.js app
#   2. terraform  : fmt check + validate the infrastructure code (no AWS credentials needed)
#   3. docker     : build the linux/amd64 image and smoke-test the running container
# On push to main only:
#   3b. publish the image to GitHub Container Registry (ghcr.io/<owner>/cloudscale-lab)
#
# No AWS credentials are used or stored. Deployment to AWS stays a manual,
# reviewed `terraform apply` (see docs/OIDC_OPTIONAL.md for automating it later).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel older runs of the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the docker job requests packages:write itself.
permissions:
  contents: read

env:
  IMAGE_NAME: cloudscale-lab
  NODE_VERSION: "24"
  TERRAFORM_VERSION: "1.17.1"

jobs:
  app:
    name: App checks (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend, no AWS access)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  docker:
    name: Docker build, smoke test${{ github.event_name == 'push' && ' & publish' || '' }}
    runs-on: ubuntu-latest
    needs: [app, terraform]
    permissions:
      contents: read
      packages: write # push to GHCR using the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      - name: Short commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # 1) Build for EC2's architecture and load into the local Docker engine.
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: APP_VERSION=sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Run the container exactly like EC2 user data does and probe it.
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 3000:3000 -e ASG_MAX=3 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/api/instance | tee /dev/stderr | grep -q '"instanceId"'
          curl -fsS -o /dev/null -w "homepage HTTP %{http_code}\n" http://localhost:3000/
          docker inspect --format 'user={{.Config.User}}' smoke

      # Always show container logs, which helps debug a failed smoke test.
      - name: Container logs
        if: always()
        run: docker logs smoke || true

      # 3) Publish (main branch pushes only; never from pull requests).
      - name: Image metadata (tags + OCI labels)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha # identical inputs, so this is a cache hit, not a rebuild

      - name: Deployment hint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Set container_image in terraform.tfvars to the sha- tag, then terraform plan/apply." >> "$GITHUB_STEP_SUMMARY"
